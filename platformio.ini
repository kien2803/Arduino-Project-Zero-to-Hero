; Shared config for building every lesson sketch with PlatformIO.
; Used by flash.sh / build.sh via: pio ci -c platformio.ini <sketch>
; You can also open this repo in VS Code + PlatformIO IDE.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.10
    arduino-irremote/IRremote@^4.0.0
    arduino-libraries/Servo@^1.3.0
    arduino-libraries/LiquidCrystal@^1.0.7
    adafruit/Adafruit NeoPixel@^1.12.0
