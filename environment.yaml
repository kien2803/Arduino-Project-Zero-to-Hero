initialize:
  - run: |
      set -e
      curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
      sudo install -m 0755 bin/arduino-cli /usr/local/bin/arduino-cli
      rm -rf bin
      arduino-cli config init --overwrite
      arduino-cli core update-index
      arduino-cli core install arduino:avr
      arduino-cli lib install MFRC522 Keypad IRremote Servo LiquidCrystal

maintenance:
  - run: |
      arduino-cli version

knowledge:
  - name: lint
    contents: |
      Sketches are "linted" by compiling with all warnings enabled.
      NOTE: arduino-cli requires the .ino filename to match its folder name,
      which this repo does not follow, so compile via a temp dir:

        compile_sketch() {
          local ino="$1" name tmp
          name=$(basename "$ino" .ino)
          tmp=$(mktemp -d)
          mkdir -p "$tmp/$name"
          cp "$ino" "$tmp/$name/$name.ino"
          find "$(dirname "$ino")" -maxdepth 1 \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -exec cp {} "$tmp/$name/" \;
          arduino-cli compile --fqbn arduino:avr:uno --warnings all "$tmp/$name"
          local rc=$?
          rm -rf "$tmp"
          return $rc
        }
        compile_sketch 01_traffic_light/traffic-light.ino
  - name: test
    contents: |
      No unit-test harness — the repo's check is compile-verifying every sketch
      for the Arduino Uno (arduino:avr:uno) target:

        fail=0
        for ino in */*.ino; do
          name=$(basename "$ino" .ino)
          tmp=$(mktemp -d)
          mkdir -p "$tmp/$name"
          cp "$ino" "$tmp/$name/$name.ino"
          find "$(dirname "$ino")" -maxdepth 1 \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -exec cp {} "$tmp/$name/" \;
          echo "== $ino"
          arduino-cli compile --fqbn arduino:avr:uno "$tmp/$name" || fail=1
          rm -rf "$tmp"
        done
        exit $fail
  - name: startup
    contents: |
      Nothing to launch: this repo is a collection of Arduino Uno sketches (.ino),
      one per project folder (see README.md roadmap, projects 01-11).
      Verify a sketch:  arduino-cli compile --fqbn arduino:avr:uno <sketch>
      Upload to hardware (requires a physical board attached):
        arduino-cli upload -p <port> --fqbn arduino:avr:uno <sketch>
